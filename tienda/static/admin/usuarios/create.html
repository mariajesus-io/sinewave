<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Usuario - Bibliotecas Para Todos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="../../css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="admin-wrapper" id="adminWrapper">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <i class="bi bi-book-half me-2"></i>BIBLIOTECA
        </div>
        <div class="sidebar-section">
          <a class="nav-link" href="../index.html"
            ><i class="bi bi-speedometer2"></i> Dashboard</a
          >
          <a class="nav-link" href="../libros/index.html"
            ><i class="bi bi-book"></i> Libros</a
          >
          <a class="nav-link" href="../autores/index.html"
            ><i class="bi bi-pen"></i> Autores</a
          >
          <a class="nav-link" href="../categorias/index.html"
            ><i class="bi bi-tags"></i> Categorías</a
          >
          <a class="nav-link" href="../ejemplares/index.html"
            ><i class="bi bi-box-seam"></i> Ejemplares</a
          >
          <div class="sidebar-label">Gestión</div>
          <a class="nav-link active" href="../usuarios/index.html"
            ><i class="bi bi-people"></i> Usuarios</a
          >
          <a class="nav-link" href="../prestamos/index.html"
            ><i class="bi bi-arrow-left-right"></i> Préstamos</a
          >
          <a class="nav-link" href="../devoluciones/index.html"
            ><i class="bi bi-arrow-return-left"></i> Devoluciones</a
          >
          <a class="nav-link" href="../reservas/index.html"
            ><i class="bi bi-bookmark-check"></i> Reservas</a
          >
          <a class="nav-link" href="../multas/index.html"
            ><i class="bi bi-exclamation-triangle"></i> Multas</a
          >
          <div class="sidebar-label">Sistema</div>
          <a class="nav-link" href="../reportes/index.html"
            ><i class="bi bi-bar-chart"></i> Reportes</a
          >
          <a class="nav-link" href="../configuracion/index.html"
            ><i class="bi bi-gear"></i> Configuración</a
          >
        </div>
      </aside>
      <div class="admin-main">
        <header class="admin-header">
          <div class="d-flex align-items-center gap-2">
            <button
              class="btn btn-outline-secondary d-lg-none"
              id="btnToggleSidebar"
            >
              <i class="bi bi-list"></i>
            </button>
            <h5 class="mb-0">Crear Usuario</h5>
          </div>
          <div class="d-flex gap-2">
            <a href="../../index.html" class="btn btn-outline-secondary btn-sm"
              >Ver Sitio</a
            ><a href="../../login.html" class="btn btn-dark btn-sm">Salir</a>
          </div>
        </header>
        <div class="admin-content">
          <div class="d-flex align-items-center mb-4">
            <a href="index.html" class="btn btn-outline-secondary me-3"
              ><i class="bi bi-arrow-left"></i
            ></a>
            <h5 class="mb-0">
              <i class="bi bi-person-plus me-2"></i>Crear Usuario
            </h5>
          </div>
          <div class="card">
            <div class="card-body">
              <form id="usuarioForm">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Nombre completo</label
                    ><input
                      type="text"
                      class="form-control"
                      id="nombre"
                      placeholder="Nombre y apellido"
                      required
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Correo electronico</label
                    ><input
                      type="email"
                      class="form-control"
                      id="email"
                      placeholder="usuario@email.com"
                      required
                    />
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Telefono</label
                    ><input
                      type="tel"
                      class="form-control"
                      id="telefono"
                      placeholder="555-0100"
                      required
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Direccion</label
                    ><input
                      type="text"
                      class="form-control"
                      id="direccion"
                      placeholder="Calle y numero"
                      required
                    />
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Estado</label
                    ><select class="form-select" id="estado" required>
                      <option value="activo">Activo</option>
                      <option value="inactivo">Inactivo</option>
                    </select>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Tipo</label
                    ><select class="form-select">
                      <option>USUARIO</option>
                      <option>BIBLIOTECARIO</option>
                      <option>ADMIN</option>
                    </select>
                  </div>
                </div>
                <hr />
                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i>Guardar</button
                  ><a href="index.html" class="btn btn-secondary">Cancelar</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document
        .getElementById("btnToggleSidebar")
        ?.addEventListener("click", () => {
          document.getElementById("sidebar").classList.toggle("show");
          document
            .getElementById("adminWrapper")
            .classList.toggle("sidebar-open");
        });
    </script>
    <script>
      document.getElementById("usuarioForm").addEventListener("submit", (e) => {
        e.preventDefault();
        alert("Usuario creado exitosamente.");
        location.href = "index.html";
      });
    </script>
  </body>
</html>
