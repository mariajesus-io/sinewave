                  <div class="col-md-6 mb-3">
                    <label class="form-label">Título</label

                      class="form-control"
                      id="titulo"
                      required
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Autor</label
                    ><input
                      type="text"
                      class="form-control"
                      id="autor"
                      required
                    />
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">ISBN</label
                    ><input
                      type="text"
                      class="form-control"
                      id="isbn"
                      required
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Editorial</label
                    ><input
                      type="text"
                      class="form-control"
                      id="editorial"
                      required
                    />
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-4 mb-3">
                    <label class="form-label">Año</label
                    ><input
                      type="number"
                      class="form-control"
                      id="anio"
                      required
                    />
                  </div>
                  <div class="col-md-4 mb-3">
                    <label class="form-label">Género</label
                    ><input
                      type="text"
                      class="form-control"
                      id="genero"
                      required
                    />
                  </div>
                  <div class="col-md-4 mb-3">
                    <label class="form-label">Estado</label
                    ><select class="form-select" id="estadoLibro">
                      <option value="disponible">Disponible</option>
                      <option value="agotado">Agotado</option>
                    </select>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Copias</label
                    ><input
                      type="number"
                      class="form-control"
                      id="copias"
                      required
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Disponibles</label
                    ><input
                      type="number"
                      class="form-control"
                      id="disponibles"
                      required
                    />
                  </div>
                </div>
                <hr />
                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-primary">
                    Actualizar</button
                  ><a href="index.html" class="btn btn-secondary">Cancelar</a>
                </div>
              </form>
            </div>
