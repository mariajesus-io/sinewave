      let libroAEliminar = null;
      (function () {
        renderizarLibros(libros);
        const generos = [...new Set(libros.map((l) => l.genero))].sort();
        document.getElementById("filtroGenero").innerHTML =
          '<option value="">Todos los géneros</option>' +
          generos.map((g) => `<option value="${g}">${g}</option>`).join("");
      })();
      function renderizarLibros(lista) {
        const tbody = document.getElementById("tablaLibros");
        if (lista.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="9" class="text-center text-muted py-4">No se encontraron libros</td></tr>';
          return;
        }
        tbody.innerHTML = lista
          .map(
            (l) =>
              `<tr><td>${l.id}</td><td><img src="${l.imagen}" style="width:34px;height:48px;object-fit:cover" class="rounded"></td><td>${l.titulo}</td><td>${l.autor}</td><td>${l.genero}</td><td>${l.anio}</td><td>${l.disponibles}</td><td><span class="badge bg-${l.estado === "disponible" ? "success" : "danger"}">${l.estado}</span></td><td class="text-center"><a href="show.html?id=${l.id}" class="btn btn-sm btn-outline-info me-1"><i class="bi bi-eye"></i></a><a href="edit.html?id=${l.id}" class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil"></i></a><button class="btn btn-sm btn-outline-danger" onclick="confirmarEliminar(${l.id})"><i class="bi bi-trash"></i></button></td></tr>`,
          )
          .join("");
      }
      function filtrarLibros() {
        const b = document.getElementById("buscarLibro").value.toLowerCase();
        const g = document.getElementById("filtroGenero").value;
        const e = document.getElementById("filtroEstado").value;
        renderizarLibros(
          libros.filter(
            (l) =>
              (l.titulo.toLowerCase().includes(b) ||
                l.autor.toLowerCase().includes(b)) &&
              (!g || l.genero === g) &&
              (!e || l.estado === e),
          ),
        );
      }
      function confirmarEliminar(id) {
        const l = libros.find((x) => x.id === id);
        libroAEliminar = id;
        document.getElementById("eliminarTitulo").textContent = l.titulo;
        new bootstrap.Modal(document.getElementById("eliminarModal")).show();
      }
      document.getElementById("btnEliminar").addEventListener("click", () => {
        libros = libros.filter((l) => l.id !== libroAEliminar);
        renderizarLibros(libros);
        bootstrap.Modal.getInstance(
          document.getElementById("eliminarModal"),
        ).hide();
      });
