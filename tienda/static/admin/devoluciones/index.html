<!doctype html>
<html lang="es">

      rel="stylesheet"
    />
    <link href="../../css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="admin-wrapper" id="adminWrapper">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <i class="bi bi-book-half me-2"></i>BIBLIOTECA
        </div>
        <div class="sidebar-section">
          <a class="nav-link" href="../index.html"
            ><i class="bi bi-speedometer2"></i> Dashboard</a
          >
          <a class="nav-link" href="../libros/index.html"
            ><i class="bi bi-book"></i> Libros</a
          >
          <a class="nav-link" href="../autores/index.html"
            ><i class="bi bi-pen"></i> Autores</a
          >
          <a class="nav-link" href="../categorias/index.html"
            ><i class="bi bi-tags"></i> Categorías</a
          >
          <a class="nav-link" href="../ejemplares/index.html"
            ><i class="bi bi-box-seam"></i> Ejemplares</a
          >
          <div class="sidebar-label">Gestión</div>
          <a class="nav-link" href="../usuarios/index.html"
            ><i class="bi bi-people"></i> Usuarios</a
          >
          <a class="nav-link" href="../prestamos/index.html"
            ><i class="bi bi-arrow-left-right"></i> Préstamos</a
          >
          <a class="nav-link active" href="../devoluciones/index.html"
            ><i class="bi bi-arrow-return-left"></i> Devoluciones</a
          >
          <a class="nav-link" href="../reservas/index.html"
            ><i class="bi bi-bookmark-check"></i> Reservas</a

          <a class="nav-link" href="../multas/index.html"

          >
          <div class="sidebar-label">Sistema</div>
          <a class="nav-link" href="../reportes/index.html"
            ><i class="bi bi-bar-chart"></i> Reportes</a
          >
          <a class="nav-link" href="../configuracion/index.html"
            ><i class="bi bi-gear"></i> Configuración</a
          >
        </div>
      </aside>
      <div class="admin-main">
        <header class="admin-header">
          <div class="d-flex align-items-center gap-2">
            <button
              class="btn btn-outline-secondary d-lg-none"
              id="btnToggleSidebar"
            >
              <i class="bi bi-list"></i>
            </button>
            <h5 class="mb-0">Devoluciones</h5>
          </div>
          <div class="d-flex gap-2">
            <a href="../../index.html" class="btn btn-outline-secondary btn-sm"
              >Ver Sitio</a
            ><a href="../../login.html" class="btn btn-dark btn-sm">Salir</a>
          </div>
        </header>
        <div class="admin-content">
          <div class="card p-4">
            <div class="row g-3 align-items-end">
              <div class="col-md-5">
                <label class="form-label">Buscar préstamo</label
                ><input
                  class="form-control"
                  placeholder="ID, usuario o libro"
                />
              </div>
              <div class="col-md-3">
                <label class="form-label">Fecha devolución</label
                ><input type="date" class="form-control" value="2026-08-30" />
              </div>
              <div class="col-md-4">
                <button class="btn btn-primary">Registrar Devolución</button>
              </div>
            </div>
            <hr />
            <div class="table-responsive">
              <table class="table mb-0">
                <thead>
                  <tr>
                    <th>Préstamo</th>
                    <th>Usuario</th>
                    <th>Libro</th>
                    <th>Días retraso</th>
                    <th>Multa</th>

                <tbody>
                  <tr>
                    <td>#3</td>
                    <td>Ana Lopez</td>
                    <td>La Casa de los Espiritus</td>
                    <td class="text-danger">8</td>
                    <td>$16.00</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document
        .getElementById("btnToggleSidebar")
        ?.addEventListener("click", () => {
          document.getElementById("sidebar").classList.toggle("show");
          document
            .getElementById("adminWrapper")
            .classList.toggle("sidebar-open");
        });
    </script>
