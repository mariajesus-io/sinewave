<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categorías - Bibliotecas Para Todos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="../../css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="admin-wrapper" id="adminWrapper">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <i class="bi bi-book-half me-2"></i>BIBLIOTECA
        </div>
        <div class="sidebar-section">
          <a class="nav-link" href="../index.html"
            ><i class="bi bi-speedometer2"></i> Dashboard</a
          >
          <a class="nav-link" href="../libros/index.html"
            ><i class="bi bi-book"></i> Libros</a
          >
          <a class="nav-link" href="../autores/index.html"
            ><i class="bi bi-pen"></i> Autores</a
          >
          <a class="nav-link active" href="../categorias/index.html"
            ><i class="bi bi-tags"></i> Categorías</a
          >
          <a class="nav-link" href="../ejemplares/index.html"
            ><i class="bi bi-box-seam"></i> Ejemplares</a
          >
          <div class="sidebar-label">Gestión</div>
          <a class="nav-link" href="../usuarios/index.html"
            ><i class="bi bi-people"></i> Usuarios</a
          >
          <a class="nav-link" href="../prestamos/index.html"
            ><i class="bi bi-arrow-left-right"></i> Préstamos</a
          >
          <a class="nav-link" href="../devoluciones/index.html"
            ><i class="bi bi-arrow-return-left"></i> Devoluciones</a
          >
          <a class="nav-link" href="../reservas/index.html"
            ><i class="bi bi-bookmark-check"></i> Reservas</a
          >
          <a class="nav-link" href="../multas/index.html"
            ><i class="bi bi-exclamation-triangle"></i> Multas</a
          >
          <div class="sidebar-label">Sistema</div>
          <a class="nav-link" href="../reportes/index.html"
            ><i class="bi bi-bar-chart"></i> Reportes</a
          >
          <a class="nav-link" href="../configuracion/index.html"
            ><i class="bi bi-gear"></i> Configuración</a
          >
        </div>
      </aside>
      <div class="admin-main">
        <header class="admin-header">
          <div class="d-flex align-items-center gap-2">
            <button
              class="btn btn-outline-secondary d-lg-none"
              id="btnToggleSidebar"
            >
              <i class="bi bi-list"></i>
            </button>
            <h5 class="mb-0">Categorías</h5>
          </div>
          <div class="d-flex gap-2">
            <a href="../../index.html" class="btn btn-outline-secondary btn-sm"
              >Ver Sitio</a
            ><a href="../../login.html" class="btn btn-dark btn-sm">Salir</a>
          </div>
        </header>
        <div class="admin-content">
          <div class="row g-3">
            <div class="col-md-3">
              <div
                class="card p-3 text-center"
                style="border-left: 4px solid #8e44ad"
              >
                <div class="fw-bold">Realismo magico</div>
                <small class="text-muted">6 libros</small>
              </div>
            </div>
            <div class="col-md-3">
              <div
                class="card p-3 text-center"
                style="border-left: 4px solid #2980b9"
              >
                <div class="fw-bold">Novela</div>
                <small class="text-muted">7 libros</small>
              </div>
            </div>
          </div>
          <div class="card mt-4">
            <div class="card-header d-flex justify-content-between">
              Listado
              <button class="btn btn-primary btn-sm">
                <i class="bi bi-plus"></i> Nueva Categoría
              </button>
            </div>
            <div class="table-responsive">
              <table class="table mb-0">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Color</th>
                    <th>Libros</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>1</td>
                    <td>Realismo magico</td>
                    <td>
                      <span class="badge" style="background: #8e44ad"
                        >#8e44ad</span
                      >
                    </td>
                    <td>6</td>
                  </tr>
                  <tr>
                    <td>2</td>
                    <td>Novela</td>
                    <td>
                      <span class="badge" style="background: #2980b9"
                        >#2980b9</span
                      >
                    </td>
                    <td>7</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document
        .getElementById("btnToggleSidebar")
        ?.addEventListener("click", () => {
          document.getElementById("sidebar").classList.toggle("show");
          document
            .getElementById("adminWrapper")
            .classList.toggle("sidebar-open");
        });
    </script>
  </body>
</html>
