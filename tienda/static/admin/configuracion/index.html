<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuración - Bibliotecas Para Todos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="../../css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="admin-wrapper" id="adminWrapper">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <i class="bi bi-book-half me-2"></i>BIBLIOTECA
        </div>
        <div class="sidebar-section">
          <a class="nav-link" href="../index.html"
            ><i class="bi bi-speedometer2"></i> Dashboard</a
          >
          <a class="nav-link" href="../libros/index.html"
            ><i class="bi bi-book"></i> Libros</a
          >
          <a class="nav-link" href="../autores/index.html"
            ><i class="bi bi-pen"></i> Autores</a
          >
          <a class="nav-link" href="../categorias/index.html"
            ><i class="bi bi-tags"></i> Categorías</a
          >
          <a class="nav-link" href="../ejemplares/index.html"
            ><i class="bi bi-box-seam"></i> Ejemplares</a
          >
          <div class="sidebar-label">Gestión</div>
          <a class="nav-link" href="../usuarios/index.html"
            ><i class="bi bi-people"></i> Usuarios</a
          >
          <a class="nav-link" href="../prestamos/index.html"
            ><i class="bi bi-arrow-left-right"></i> Préstamos</a
          >
          <a class="nav-link" href="../devoluciones/index.html"
            ><i class="bi bi-arrow-return-left"></i> Devoluciones</a
          >
          <a class="nav-link" href="../reservas/index.html"
            ><i class="bi bi-bookmark-check"></i> Reservas</a
          >
          <a class="nav-link" href="../multas/index.html"
            ><i class="bi bi-exclamation-triangle"></i> Multas</a
          >
          <div class="sidebar-label">Sistema</div>
          <a class="nav-link" href="../reportes/index.html"
            ><i class="bi bi-bar-chart"></i> Reportes</a
          >
          <a class="nav-link active" href="../configuracion/index.html"
            ><i class="bi bi-gear"></i> Configuración</a
          >
        </div>
      </aside>
      <div class="admin-main">
        <header class="admin-header">
          <div class="d-flex align-items-center gap-2">
            <button
              class="btn btn-outline-secondary d-lg-none"
              id="btnToggleSidebar"
            >
              <i class="bi bi-list"></i>
            </button>
            <h5 class="mb-0">Configuración</h5>
          </div>
          <div class="d-flex gap-2">
            <a href="../../index.html" class="btn btn-outline-secondary btn-sm"
              >Ver Sitio</a
            ><a href="../../login.html" class="btn btn-dark btn-sm">Salir</a>
          </div>
        </header>
        <div class="admin-content">
          <div class="row g-4">
            <div class="col-lg-6">
              <div class="card p-4">
                <h6>Parámetros de préstamo</h6>
                <div class="mb-3">
                  <label class="form-label">Días de préstamo</label
                  ><input class="form-control" value="14" />
                </div>
                <div class="mb-3">
                  <label class="form-label">Multa por día (USD)</label
                  ><input class="form-control" value="2.00" />
                </div>
                <button class="btn btn-primary">Guardar</button>
              </div>
            </div>
            <div class="col-lg-6">
              <div class="card p-4">
                <h6>Biblioteca</h6>
                <div class="mb-3">
                  <label class="form-label">Nombre</label
                  ><input class="form-control" value="Bibliotecas Para Todos" />
                </div>
                <div class="mb-3">
                  <label class="form-label">Email</label
                  ><input
                    class="form-control"
                    value="info@bibliotecasparatodos.com"
                  />
                </div>
                <button class="btn btn-primary">Actualizar</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document
        .getElementById("btnToggleSidebar")
        ?.addEventListener("click", () => {
          document.getElementById("sidebar").classList.toggle("show");
          document
            .getElementById("adminWrapper")
            .classList.toggle("sidebar-open");
        });
    </script>
  </body>
</html>
