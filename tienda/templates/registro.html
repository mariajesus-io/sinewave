{% extends 'base.html' %}
{% load static %}
{% block title %}Crear cuenta - Sinewave{% endblock %}
{% block content %}
<div class="auth-wrapper" style="background:linear-gradient(135deg,var(--bg),var(--primary))">
  <div class="card auth-card bg-dark text-light border-secondary"><div class="card-body p-4 p-md-5">
    <div class="text-center mb-4"><img src="{% static 'img/logo_white_cropped.png' %}" alt="Sinewave" style="height:100px"><h1 class="h4 mt-3">Crear cuenta</h1></div>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label" for="nombre">Nombre completo</label><input class="form-control" id="nombre" name="nombre" value="{{ datos.nombre }}" maxlength="150" required></div>
      <div class="mb-3"><label class="form-label" for="correo">Correo electrónico</label><input class="form-control" type="email" id="correo" name="correo" value="{{ datos.correo }}" maxlength="150" required></div>
      <div class="mb-3"><label class="form-label" for="telefono">Teléfono</label><input class="form-control" id="telefono" name="telefono" value="{{ datos.telefono }}" maxlength="20"></div>
      <div class="mb-3"><label class="form-label" for="password1">Contraseña</label><input class="form-control" type="password" id="password1" name="password1" required></div>
      <div class="mb-3"><label class="form-label" for="password2">Confirmar contraseña</label><input class="form-control" type="password" id="password2" name="password2" required></div>
      <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
    </form>
    <p class="text-center mt-4 mb-0">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
  </div></div>
</div>
{% endblock %}
